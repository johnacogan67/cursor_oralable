# Oralable MAM Algorithm Specification
# Single source of truth for Python research and Swift production.
# Phone must match Mac unless listed in docs/ALGORITHM_ARCHITECTURE.md §0 exceptions.

metadata:
  id: oralable-algorithm-v1
  version: 1.0.0
  owner: Oralable signal-processing team
  status: research-reference-with-production-parity-gate

sampling:
  ppg_hz: 50.0
  accel_hz: 100.0

filters:
  ppg_bandpass:
    lowcut_hz: 0.5
    highcut_hz: 8.0
    order: 4
  ir_dc_lowpass:
    cutoff_hz: 0.8
    order: 4
  temporalis_ac_bandpass:
    lowcut_hz: 0.5
    highcut_hz: 4.0
    order: 4
  accel_median:
    window: 5

buffers:
  ppg_circular_size: 100
  hr_window_samples: 150
  spo2_window_samples: 150

sync_taps:
  window_seconds: 2.0
  sigma_threshold: 3.0
  min_distance_ms: 80

beat_detection:
  min_distance_seconds: 0.4
  prominence_factor: 0.5
  min_bpm: 40
  max_bpm: 180

spo2:
  # ClinicalBiometricSuite / Mac Protocol A
  formula: linear_110_minus_25R   # SpO2 = 110 - 25*R
  intercept: 110.0
  r_coefficient: 25.0
  clamp_min: 60
  clamp_max: 100
  window_seconds: 3.0
  # Prep: red/ir DC = LP 0.8 Hz; red/ir AC = BP 0.5–8 Hz; R = (AC_rms/DC)/(AC_rms/DC)

airway_rescue:
  # Sample-level ClinicalBiometricSuite (not overnight 15%/92% state machine)
  window_ms: 500
  ir_dc_drop_threshold: -0.10   # -10% drop within window

sashb:
  spo2_threshold: 90.0
  dt_s: 0.02

mam:
  window_samples: 50
  # Training default stride; phone inference aligned to 25
  stride_samples: 25
  # Product quiet-gate (classification only) — see exceptions registry
  activity_gate_shift_percent: 10.0
